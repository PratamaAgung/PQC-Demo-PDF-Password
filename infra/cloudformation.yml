AWSTemplateFormatVersion: '2010-09-09'
Description: PQC Demo - ECS Express Mode

Parameters:
  ImageUri:
    Type: String
    Description: ECR image URI (e.g., 123456789.dkr.ecr.ap-southeast-1.amazonaws.com/pqc-demo:latest)

Resources:
  # ============ ECR ============
  ECRRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: pqc-demo
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep last 5 images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 5
                },
                "action": {
                  "type": "expire"
                }
              }
            ]
          }

  # ============ IAM Roles ============
  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: pqc-demo-ecs-execution-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  ECSInfrastructureRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: pqc-demo-ecs-infrastructure-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSInfrastructureRolePolicyForServiceConnectTransportLayerSecurity

  # ============ CloudWatch Logs ============
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/pqc-demo
      RetentionInDays: 7

Outputs:
  ECRRepositoryUri:
    Description: ECR Repository URI
    Value: !GetAtt ECRRepository.RepositoryUri
  ExecutionRoleArn:
    Description: ECS Task Execution Role ARN
    Value: !GetAtt ECSTaskExecutionRole.Arn
  InfrastructureRoleArn:
    Description: ECS Infrastructure Role ARN
    Value: !GetAtt ECSInfrastructureRole.Arn
