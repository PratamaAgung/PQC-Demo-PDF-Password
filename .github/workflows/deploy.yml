name: Deploy to AWS ECS Express Mode

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-southeast-1
  ECR_REPOSITORY: pqc-demo
  SERVICE_NAME: pqc-demo-d950
  ECS_CLUSTER: default
  ECS_INFRA_ROLE: pqc-demo-ecs-infrastructure-role
  ECS_EXEC_ROLE: ecsTaskExecutionRole

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build, tag, and push image to ECR
        id: build-image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          provenance: false

      - name: Set image output
        id: set-image
        run: echo "image=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Resolve IAM role ARNs
        id: roles
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "exec_role=arn:aws:iam::${ACCOUNT_ID}:role/${{ env.ECS_EXEC_ROLE }}" >> $GITHUB_OUTPUT
          echo "infra_role=arn:aws:iam::${ACCOUNT_ID}:role/${{ env.ECS_INFRA_ROLE }}" >> $GITHUB_OUTPUT

      - name: Deploy to ECS Express Mode
        id: deploy
        env:
          IMAGE: ${{ steps.set-image.outputs.image }}
          EXEC_ROLE: ${{ steps.roles.outputs.exec_role }}
          INFRA_ROLE: ${{ steps.roles.outputs.infra_role }}
        run: |
          # Check if service already exists
          SERVICE_ARN=$(aws ecs list-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --query "serviceArns[?contains(@, '${{ env.SERVICE_NAME }}')]|[0]" \
            --output text --region ${{ env.AWS_REGION }} 2>/dev/null || echo "None")

          if [ "$SERVICE_ARN" = "None" ] || [ -z "$SERVICE_ARN" ]; then
            echo "Creating new ECS Express Mode service..."
            RESULT=$(aws ecs create-express-gateway-service \
              --cluster ${{ env.ECS_CLUSTER }} \
              --service-name ${{ env.SERVICE_NAME }} \
              --primary-container "{\"image\":\"$IMAGE\",\"containerPort\":80}" \
              --execution-role-arn $EXEC_ROLE \
              --infrastructure-role-arn $INFRA_ROLE \
              --cpu "512" \
              --memory "1024" \
              --health-check-path "/api/health" \
              --scaling-target '{"minTaskCount":1,"maxTaskCount":1}' \
              --monitor-resources \
              --region ${{ env.AWS_REGION }})
            SERVICE_ARN=$(echo $RESULT | jq -r '.service.serviceArn')
            echo "Created: $SERVICE_ARN"
          else
            echo "Updating existing service: $SERVICE_ARN"
            aws ecs update-express-gateway-service \
              --service-arn $SERVICE_ARN \
              --primary-container "{\"image\":\"$IMAGE\",\"containerPort\":80}" \
              --monitor-resources \
              --region ${{ env.AWS_REGION }}
          fi

          echo "service_arn=$SERVICE_ARN" >> $GITHUB_OUTPUT

      - name: Get service URL
        run: |
          echo ""
          echo "═══════════════════════════════════════════"
          echo "  ✅ Deployment complete!"
          echo "  Cluster: ${{ env.ECS_CLUSTER }}"
          echo "  Service: ${{ env.SERVICE_NAME }}"
          echo "═══════════════════════════════════════════"
