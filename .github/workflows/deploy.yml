name: Deploy to ECS Express Mode

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-southeast-1
  ECR_REPOSITORY: pqc-demo
  ECS_SERVICE_NAME: pqc-demo

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Get ECS Express service ARN
        id: get-service
        run: |
          SERVICE_ARN=$(aws ecs list-services \
            --query "serviceArns[?contains(@, '${{ env.ECS_SERVICE_NAME }}')]|[0]" \
            --output text 2>/dev/null || echo "")

          if [ -z "$SERVICE_ARN" ] || [ "$SERVICE_ARN" = "None" ]; then
            echo "service_exists=false" >> $GITHUB_OUTPUT
          else
            echo "service_exists=true" >> $GITHUB_OUTPUT
            echo "service_arn=$SERVICE_ARN" >> $GITHUB_OUTPUT
          fi

      - name: Create ECS Express service (first time)
        if: steps.get-service.outputs.service_exists == 'false'
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          EXECUTION_ROLE="arn:aws:iam::${ACCOUNT_ID}:role/pqc-demo-ecs-execution-role"
          INFRA_ROLE="arn:aws:iam::${ACCOUNT_ID}:role/pqc-demo-ecs-infrastructure-role"

          aws ecs create-express-gateway-service \
            --primary-container "image=${{ steps.build-image.outputs.image }},port=80,healthCheckPath=/api/health" \
            --execution-role-arn $EXECUTION_ROLE \
            --infrastructure-role-arn $INFRA_ROLE \
            --monitor-resources

          echo "🚀 ECS Express service created!"

      - name: Update ECS Express service
        if: steps.get-service.outputs.service_exists == 'true'
        run: |
          aws ecs update-express-gateway-service \
            --service-arn ${{ steps.get-service.outputs.service_arn }} \
            --primary-container '{"image": "${{ steps.build-image.outputs.image }}"}'

          echo "🚀 ECS Express service updated with new image"
